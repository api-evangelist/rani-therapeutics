name: Rani Therapeutics
description: 'Rani Therapeutics is a clinical-stage biotechnology company developing the RaniPill, an
  ingestible robotic capsule engineered to deliver biologic drugs orally in place of subcutaneous or
  intravenous injections. The platform aims to preserve injection-comparable bioavailability while
  removing the pain and adherence barriers of needle-based therapies across chronic and metabolic
  disease areas. Surfaced as a portfolio company of GV and added to the API Evangelist network; the
  company is a publicly traded life-sciences firm and does not currently publish a developer API,
  developer portal, or programmatic data surface.'
